<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warzone Tanks Online - Team Skirmish</title>
    <style>
        body, html { 
            margin: 0; padding: 0; background: #000; color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; width: 100vw; height: 100vh; 
        }
        
        canvas { 
            display: block; margin: 0 auto; background: #111; border: 2px solid #333; 
        }
        
        .screen { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: #000; z-index: 10; 
        }
        
        .hidden { display: none !important; }
        
        button { 
            padding: 10px 20px; margin: 5px; font-size: 16px; font-weight: bold; 
            cursor: pointer; border: 2px solid #00ff66; background: #111; color: #00ff66; 
            border-radius: 5px; text-transform: uppercase; transition: 0.2s; 
        }
        button:hover:not(:disabled) { background: #00ff66; color: #000; }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; }

        /* --- NEW TEAM HUD --- */
        #hud { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        #team-scoreboard {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 30px; align-items: center;
            background: rgba(0,0,0,0.8); border: 2px solid #555; border-radius: 10px; padding: 10px 40px;
        }
        .score-num { font-size: 36px; font-weight: 900; }
        #score-t1 { color: #00aaff; }
        #score-t2 { color: #ff3333; }

        #local-hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 2px solid #555; border-radius: 10px;
            padding: 15px 30px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hp-bar-bg { width: 350px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; position: relative; margin-bottom: 15px; }
        .hp-bar-fill { height: 100%; width: 100%; background: #00ff00; position: absolute; top: 0; left: 0; z-index: 2; transition: width 0.1s linear, background-color 0.2s; }
        .hp-bar-trail { height: 100%; width: 100%; background: #fff; position: absolute; top: 0; left: 0; z-index: 1; transition: width 0.6s ease-out 0.15s; }
        
        .skill-icon { width: 60px; height: 60px; border: 2px solid #555; background: #222; position: relative; overflow: hidden; border-radius: 5px; transition: border-color 0.2s, box-shadow 0.2s; }
        .skill-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(255,255,255,0.2); }
        .skill-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 1.5rem; text-shadow: 1px 1px 2px #000; z-index: 2; }
        .ammo-text { position: absolute; top: 4px; right: 6px; color: gold; font-size: 1rem; font-weight: bold; z-index: 3; text-shadow: 1px 1px 1px #000; }

        .loader { border: 6px solid #111; border-top: 6px solid #00ff66; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- LEAGUE MENU & LOBBY UI --- */
        .bg-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease-in-out; }
        .bg-slide.active { opacity: 1; }
        .glass-panel { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        
        .team-column { flex: 1; display: flex; flex-direction: column; gap: 15px; padding: 20px; border-radius: 10px; background: rgba(0,0,0,0.5); }
        .t1-col { border-top: 4px solid #00aaff; }
        .t2-col { border-top: 4px solid #ff3333; }
        
        .player-slot { display: flex; align-items: center; background: #1a1a1a; border: 1px solid #333; padding: 10px; border-radius: 8px; gap: 15px; position: relative;}
        .player-slot.ready { border-color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        .player-slot img { width: 60px; height: 60px; object-fit: contain; }
        .you-badge { background: #00ff66; color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 10px; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="auth-screen" class="screen" style="display: flex;">
        <div style="background: rgba(15, 15, 15, 0.95); padding: 40px; border: 2px solid #00ff66; border-radius: 10px; text-align: center; width: 350px; box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);">
            <h1 style="color: #00ff66; margin-top: 0; font-size: 32px; text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);">WARZONE</h1>
            <p style="color: #aaa; margin-bottom: 25px; font-weight: bold; letter-spacing: 2px;">AUTHENTICATION</p>
            <input type="text" id="auth-username" placeholder="USERNAME" style="width: 85%; padding: 12px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; outline: none; text-align: center; font-weight: bold; text-transform: uppercase;">
            <input type="password" id="auth-password" placeholder="PASSWORD" style="width: 85%; padding: 12px; margin: 10px 0; background: #111; color: #fff; border: 1px solid #333; outline: none; text-align: center; font-weight: bold;">
            <div id="auth-message" style="color: #ff3333; margin: 10px 0; height: 20px; font-weight: bold; font-size: 14px;"></div>
            <button id="btn-login" style="width: 93%; background: #00ff66; color: #000; margin-top: 10px;">LOG IN</button>
            <button id="btn-register" style="width: 93%; border-color: #00aaff; color: #00aaff; background: transparent;">REGISTER</button>
            <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                <button id="btn-guest" style="width: 93%; border: none; color: #777; background: transparent; font-size: 14px;">PLAY AS GUEST</button>
            </div>
        </div>
    </div>

    <div id="main-menu" class="screen hidden" style="justify-content: flex-start; background: #050505;">
        <div id="bg-slideshow" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: -1; pointer-events: none;">
            <div class="bg-slide active" style="background-image: url('assets/WZBG1.png');"></div>
            <div class="bg-slide" style="background-image: url('assets/WZBG2.png');"></div>
            <div class="bg-slide" style="background-image: url('assets/WZBG3.png');"></div>
            <div style="position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 0 150px rgba(0,0,0,0.9);"></div>
        </div>
        
        <div class="glass-panel" style="width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box; border-bottom: 1px solid rgba(0, 255, 102, 0.3); z-index: 2;">
            <div style="display: flex; align-items: center; gap: 30px;">
                <div style="font-size: 34px; font-weight: 900; color: #fff; letter-spacing: 4px;">WZ<span style="color: #00ff66;">TO</span></div>
            </div>
            
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 10px;">
                <button id="btn-master-play" style="margin: 0; padding: 12px 50px; font-size: 26px; letter-spacing: 3px; box-shadow: 0 0 20px rgba(0,255,102,0.3);">PLAY</button>
                <div id="play-dropdown" style="display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px; background: rgba(10, 10, 10, 0.98); border: 1px solid #00ff66; border-radius: 5px; flex-direction: column; width: 280px;">
                    <button onclick="startMode('ARCADE')" style="border: none; background: transparent; color: #fff; font-size: 16px; padding: 15px; border-bottom: 1px solid #333;">SINGLE PLAYER</button>
                    <button id="btn-online" style="border: none; background: transparent; color: #00aaff; font-size: 16px; padding: 15px;">ONLINE MULTIPLAYER</button>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <div style="text-align: right;">
                    <div id="menu-username" style="font-weight: bold; font-size: 18px; color: #00ff66;">GUEST</div>
                    <div style="font-size: 12px; color: #aaa;">Level 1 | 0 Credits</div>
                </div>
            </div>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden" style="background:#111; padding: 40px; box-sizing: border-box;">
        <h1 style="text-align: center; text-shadow: 0 0 10px #00ff66; font-size: 40px;">ONLINE LOBBY</h1>
        <div id="games-list-container" style="flex-grow: 1; width: 80%; max-width: 800px; border: 2px solid #00ff66; background: #000; margin: 20px 0; overflow-y: auto; border-radius: 5px;">
            <ul id="games-list" style="list-style: none; padding: 0; margin: 0; font-size: 24px;">
                <li style="padding: 20px; color: #777; text-align: center;">Connecting to server...</li>
            </ul>
        </div>
        <div style="display: flex; justify-content: space-between; width: 80%; max-width: 800px;">
            <button id="btn-lobby-back" style="background: #333; color: #fff; border-color: #fff;">BACK TO MENU</button>
            <button id="btn-lobby-create" style="background: #00ff66; color: #000;">CREATE GAME</button>
        </div>
    </div>

    <div id="select-screen" class="screen hidden" style="background: #0a0a0a; padding: 20px; box-sizing: border-box; flex-direction: row; gap: 20px; align-items: stretch;">
        
        <div class="team-column t1-col" id="team1-container">
            <h2 style="color: #00aaff; text-align: center; margin-top: 0;">TEAM 1 (BLUE)</h2>
            <div id="t1-slots"></div>
        </div>

        <div style="flex: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; border: 1px solid #333;">
            <div style="text-align: center; width: 100%;">
                <h2 style="color: #00ff66; margin: 0 0 10px 0;">ROOM: <span id="room-code-display">----</span></h2>
                
                <div id="host-controls" style="display: none; gap: 10px; justify-content: center; margin-bottom: 20px;">
                    <button onclick="uiChangeMode('1v1')" style="padding: 5px 15px; font-size: 14px;">1v1</button>
                    <button onclick="uiChangeMode('2v2')" style="padding: 5px 15px; font-size: 14px;">2v2</button>
                    <button onclick="uiChangeMode('3v3')" style="padding: 5px 15px; font-size: 14px;">3v3</button>
                </div>
            </div>

            <div style="width: 100%; height: 250px; background: #1a1a1a; border: 2px solid #555; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                <img id="minimap-image" src="assets/BGbattle.png" style="position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0.4;">
                <h3 id="map-name" style="z-index: 2; font-size: 24px; text-shadow: 0 0 10px #000;">MAP: DUSK</h3>
            </div>
            
            <button id="btn-map-select" style="margin-top: 10px; display: none;">Change Map</button>

            <div id="my-controls" style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; background: #111; padding: 15px; border-radius: 8px; border: 1px dashed #555;">
                <div style="display: flex; justify-content: space-between;">
                    <button onclick="uiCycleTank(-1)" style="flex: 1; border-color: #aaa; color: #aaa;">◄ PREV TANK</button>
                    <button onclick="uiCycleTank(1)" style="flex: 1; border-color: #aaa; color: #aaa;">NEXT TANK ►</button>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <button onclick="uiSwitchTeam()" style="flex: 1; background: #333; color: #fff; border-color: #555;">SWITCH TEAM</button>
                    <button id="btn-local-ready" onclick="uiToggleReady()" style="flex: 1; background: #ffaa00; color: #000; border-color: #ffaa00;">READY UP</button>
                </div>
            </div>

            <button id="btn-launch-game" disabled style="width: 100%; padding: 20px; font-size: 24px; margin-top: 20px;">START GAME</button>
        </div>

        <div class="team-column t2-col" id="team2-container">
            <h2 style="color: #ff3333; text-align: center; margin-top: 0;">TEAM 2 (RED)</h2>
            <div id="t2-slots"></div>
        </div>

    </div>

    <div id="game-container" style="position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        
        <div id="hud" class="hidden">
            <div id="team-scoreboard">
                <span id="score-t1" class="score-num">0</span>
                <span style="color: #777; font-size: 24px;">VS</span>
                <span id="score-t2" class="score-num">0</span>
            </div>

            <div id="local-hud">
                <div class="hp-bar-bg">
                    <div id="local-hp-trail" class="hp-bar-trail"></div>
                    <div id="local-hp" class="hp-bar-fill"></div>
                </div>
                <div id="local-skills" style="display: flex; gap: 15px;">
                    <div class="skill-icon" id="local-cd-c"><div id="local-fill-c" class="skill-fill"></div><span class="skill-text">C</span><span id="local-ammo-c" class="ammo-text"></span></div>
                    <div class="skill-icon" id="local-cd-x"><div id="local-fill-x" class="skill-fill"></div><span class="skill-text">X</span><span id="local-ammo-x" class="ammo-text"></span></div>
                    <div class="skill-icon" id="local-cd-z"><div id="local-fill-z" class="skill-fill"></div><span class="skill-text">Z</span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="victory-screen" class="screen hidden" style="background: rgba(0,0,0,0.9);">
        <h1 id="victory-title" style="font-size: 60px; margin-bottom: 20px;">TEAM WINS!</h1>
        <button id="btn-restart" onclick="location.reload()" style="padding: 15px 40px; font-size: 24px;">RETURN TO LOBBY</button>
    </div>

    <script src="config.js"></script>
    <script src="Projectile.js"></script>
    <script src="Tank.js"></script>
    <script src="network.js"></script>
    <script src="ui.js"></script>
    <script src="engine.js"></script>

</body>
</html>
